esphome:
  name: bms-display
  friendly_name: BMS Display

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "BMS Display Fallback"
    password: "12345678"

captive_portal:

i2c:
  sda: GPIO4
  scl: GPIO3
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_medium
    size: 13

  - file: "gfonts://Roboto"
    id: font_header
    size: 12

globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: "0"

  - id: target_page
    type: int
    restore_value: no
    initial_value: "0"

  - id: animation_offset
    type: int
    restore_value: no
    initial_value: "0"

  - id: animating
    type: bool
    restore_value: no
    initial_value: "false"

sensor:

  # AKUMULATOR

  - platform: homeassistant
    id: bms_soc
    entity_id: sensor.12v280_bateria

  - platform: homeassistant
    id: bms_voltage
    entity_id: sensor.12v280_napiecie

  - platform: homeassistant
    id: bms_current
    entity_id: sensor.12v280_natezenie_pradu

  - platform: homeassistant
    id: bms_power
    entity_id: sensor.12v280_moc

  - platform: homeassistant
    id: bms_temperature
    entity_id: sensor.12v280_temperatura

  - platform: homeassistant
    id: bms_delta
    entity_id: sensor.12v280_delta_voltage


  # SOLAR

  - platform: homeassistant
    id: solar_current
    entity_id: sensor.smartsolarkamp_current

  - platform: homeassistant
    id: solar_power
    entity_id: sensor.smartsolarkamp_power

  - platform: homeassistant
    id: solar_voltage
    entity_id: sensor.smartsolarkamp_voltage

  - platform: homeassistant
    id: solar_today
    entity_id: sensor.smartsolarkamp_yield_today


interval:

  # Automatyczna zmiana ekranu co 6 sekund

  - interval: 6s
    then:
      - lambda: |-
          if (!id(animating)) {
            id(target_page) = 1 - id(current_page);
            id(animation_offset) = 0;
            id(animating) = true;
          }


  # Dane na ekranie odświeżane co 1 sekundę

  - interval: 1s
    then:
      - lambda: |-
          if (!id(animating)) {
            id(oled_display).update();
          }


  # Szybkie klatki tylko podczas animacji

  - interval: 20ms
    then:
      - lambda: |-
          if (id(animating)) {

            id(animation_offset) += 20;

            if (id(animation_offset) >= 128) {
              id(animation_offset) = 128;
            }

            id(oled_display).update();

            if (id(animation_offset) >= 128) {
              id(current_page) = id(target_page);
              id(animation_offset) = 0;
              id(animating) = false;
              id(oled_display).update();
            }
          }


display:

  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: never

    lambda: |-

      auto draw_battery = [&](int x) {

        it.printf(
          x,
          0,
          id(font_header),
          "AKUMULATOR"
        );

        if (!isnan(id(bms_soc).state)) {

          it.printf(
            x + 127,
            0,
            id(font_header),
            TextAlign::TOP_RIGHT,
            "%.0f%%",
            id(bms_soc).state
          );

          float soc = id(bms_soc).state;

          if (soc < 0) soc = 0;
          if (soc > 100) soc = 100;

          int fill_width = (int)(soc * 1.22f);

          it.rectangle(
            x + 1,
            16,
            126,
            7
          );

          if (fill_width > 0) {
            it.filled_rectangle(
              x + 3,
              18,
              fill_width,
              3
            );
          }
        }

        if (!isnan(id(bms_voltage).state)) {

          it.printf(
            x + 1,
            30,
            id(font_medium),
            "%.2f V",
            id(bms_voltage).state
          );
        }

        if (!isnan(id(bms_current).state)) {

          it.printf(
            x + 127,
            30,
            id(font_medium),
            TextAlign::TOP_RIGHT,
            "%.1f A",
            id(bms_current).state
          );
        }

        if (!isnan(id(bms_power).state)) {

          it.printf(
            x + 1,
            49,
            id(font_medium),
            "%.0f W",
            fabs(id(bms_power).state)
          );
        }

        if (!isnan(id(bms_temperature).state)) {

          it.printf(
            x + 127,
            49,
            id(font_medium),
            TextAlign::TOP_RIGHT,
            "%.1f C",
            id(bms_temperature).state
          );
        }
      };


      auto draw_solar = [&](int x) {

        it.printf(
          x,
          0,
          id(font_header),
          "SOLAR"
        );

        if (!isnan(id(solar_voltage).state)) {

          it.printf(
            x + 1,
            22,
            id(font_medium),
            "%.2f V",
            id(solar_voltage).state
          );
        }

        if (!isnan(id(solar_current).state)) {

          it.printf(
            x + 127,
            22,
            id(font_medium),
            TextAlign::TOP_RIGHT,
            "%.1f A",
            id(solar_current).state
          );
        }

        if (!isnan(id(solar_power).state)) {

          it.printf(
            x + 1,
            46,
            id(font_medium),
            "%.0f W",
            id(solar_power).state
          );
        }

        if (!isnan(id(solar_today).state)) {

          it.printf(
            x + 127,
            46,
            id(font_medium),
            TextAlign::TOP_RIGHT,
            "Dzis %.0f Wh",
            id(solar_today).state
          );
        }
      };


      if (!id(animating)) {

        if (id(current_page) == 0) {
          draw_battery(0);
        } else {
          draw_solar(0);
        }

      } else {

        int offset = id(animation_offset);

        int current_x = -offset;
        int target_x = 128 - offset;

        if (id(current_page) == 0) {
          draw_battery(current_x);
        } else {
          draw_solar(current_x);
        }

        if (id(target_page) == 0) {
          draw_battery(target_x);
        } else {
          draw_solar(target_x);
        }
      }